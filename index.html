<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resonance Base – Android ROM Hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap">
<style>
:root{--bg:#0a0d12;--s:#121821;--s2:#1a222d;--line:#26313f;--text:#e8edf2;--mut:#8b98a8;--cy:#5fe0d0;--gold:#e0c07a;--ink:#06231f;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--text);font:500 1.05rem/1.5 Rajdhani,system-ui,sans-serif;background:radial-gradient(900px 420px at 85% -80px,#12353a 0,transparent 70%),radial-gradient(700px 400px at 0 20%,#2a2414 0,transparent 65%),var(--bg);min-height:100vh}
.wrap{max-width:1040px;margin:0 auto;padding:18px 16px 56px}
.brand{font-weight:700;font-size:1.2rem;letter-spacing:.14em;color:var(--gold)}
.brand i{display:inline-block;width:10px;height:10px;background:var(--cy);transform:rotate(45deg);margin-right:10px;box-shadow:0 0 12px var(--cy)}
h1{font-size:clamp(2.2rem,8vw,3.8rem);line-height:1;margin:40px 0 10px;font-weight:700;letter-spacing:.01em}
.lead{color:var(--mut);max-width:50ch;margin:0 0 26px}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--cy)}
button:focus-visible,input:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{background:none;border:0;padding:10px 16px;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap;font-weight:600}
.tab[aria-selected="true"]{color:var(--cy);border-color:var(--cy)}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.in{flex:1 1 220px;background:var(--s);border:1px solid var(--line);padding:10px 14px;color:var(--text);font:inherit}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--s);border:1px solid var(--line);padding:5px 14px;font-weight:600;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--cy);color:var(--ink);border-color:var(--cy)}
.count{color:var(--mut);margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.cut{clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px))}
.card{background:var(--s);border-left:3px solid var(--gold);display:flex;flex-direction:column}
.card .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.bn{position:relative;overflow:hidden;background:linear-gradient(135deg,hsl(var(--h) 45% 24%),#0a0d12);aspect-ratio:16/9}
.bn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bn.big{aspect-ratio:16/6;margin:26px 0 16px}
.card h3{margin:0;font-size:1.3rem;line-height:1.2}
.card h3 a{color:inherit;text-decoration:none}.card h3 a:hover{color:var(--cy)}
.m{color:var(--mut);margin:0;font-size:.98rem}
.badges{display:flex;gap:6px}
.tag{background:var(--s2);padding:1px 10px;font-size:.85rem;font-weight:700;letter-spacing:.04em}
.stable{background:var(--cy);color:var(--ink)}.pre{background:var(--gold);color:#2b2108}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:6px}
.vote,.ghost{background:none;border:1px solid var(--line);padding:5px 14px;font-weight:600}
.vote[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.go,.dl{background:var(--cy);color:var(--ink);border:0;padding:8px 20px;font-weight:700;text-decoration:none;display:inline-block}
.dl.alt{background:none;color:var(--gold);border:1px solid var(--gold)}
.dl.off{background:var(--s2);color:var(--mut);cursor:not-allowed}
.empty{padding:40px 0;color:var(--mut)}
.back{color:var(--mut);text-decoration:none;display:inline-block;margin:26px 0 0}.back:hover{color:var(--text)}
.dt{font-size:clamp(1.9rem,6vw,2.8rem);margin:10px 0 4px;max-width:none}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 22px}
.pane h4{margin:26px 0 8px;font-size:1.15rem;color:var(--gold);letter-spacing:.06em}
.pane ul,.pane ol{margin:0;padding-left:22px;color:var(--mut)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 20px;margin:0;color:var(--mut)}.kv b{color:var(--text);font-weight:600}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.shots img{width:100%;display:block;border:1px solid var(--line)}
.cm{background:var(--s);border-left:3px solid var(--cy);padding:10px 14px;margin-bottom:8px}
textarea.in{width:100%;min-height:80px;margin:10px 0;display:block;resize:vertical}
footer{margin-top:48px;padding-top:16px;border-top:1px solid var(--line);color:var(--mut);font-size:.9rem}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--gold);color:#2b2108;padding:10px 18px;font-weight:700;opacity:0;transition:.25s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<div class="brand"><i></i>RESONANCE BASE</div>
<section id="list">
<h1>Ports, ROMs and kernels</h1>
<p class="lead">Browse community builds, vote for the ones that work, and download them to flash.</p>
<div class="tabs" role="tablist">
<button class="tab" role="tab" data-s="new" aria-selected="true">Newest</button>
<button class="tab" role="tab" data-s="pop" aria-selected="false">Most popular</button>
<button class="tab" role="tab" data-s="dl" aria-selected="false">Most downloaded</button>
</div>
<div class="tools"><input class="in" id="q" type="search" placeholder="Search by name, device or codename" aria-label="Search posts"><div class="chips" id="chips"></div></div>
<p class="count" id="count"></p>
<div class="grid" id="grid"></div>
</section>
<section id="detail" hidden></section>
<footer>Resonance Base is a community project. Flash at your own risk.</footer>
</div>
<div id="toast" role="status"></div>

<script>
/* ===== DATA: edit here to add, change or remove posts =====
Each post is one {...} block, separated by commas. Copy a block to add a post.
type: Port | Custom ROM | GSI | Custom Kernel | Custom Recovery
stable: true = Stable, false = Pre-release
banner / shots: image paths inside the repo (e.g. "img/xyz.jpg") or full image URLs. Leave "" or [] if none.
direct / mirror: download links. Leave "" to disable the button.
date: YYYY-MM-DD (used for the Newest sort). id must be unique. */
const POSTS=[
{id:1,title:"OxygenOS 16.0.10",type:"Port",stable:true,device:"Infinix NOTE 30",codename:"X6833B",android:"Android 16",by:"@your_name",size:"1.9 GB",date:"2026-10-06",
banner:"",shots:[],direct:"https://example.com/direct",mirror:"https://example.com/mirror",
info:"Hybrid build with extra audio tuning.",
changelog:["Initial release","Added Dolby audio"],
about:"OxygenOS port for the Infinix NOTE 30, smooth for daily use.",
bugs:["No known bugs yet"],
guide:["Flash the ROM in recovery","Format data","Reboot system"],
credits:["@dev_one (base source)","@dev_two (bug fixes)"],votes:7,dl:120},
{id:2,title:"LunarOS 2.1",type:"Custom ROM",stable:false,device:"Redmi Note 12",codename:"tapas",android:"Android 14",by:"@lunar_dev",size:"1.4 GB",date:"2026-10-03",
banner:"",shots:[],direct:"https://example.com/lunar",mirror:"",
info:"Early build, please report bugs.",changelog:["First public beta"],about:"A clean, fast custom ROM.",
bugs:["Camera video may crash"],guide:["Unlock bootloader","Flash recovery","Flash ROM, then format data"],credits:["@lunar_dev"],votes:128,dl:5400},
{id:3,title:"Treble GSI Vanilla",type:"GSI",stable:true,device:"Any Treble device",codename:"arm64-ab",android:"Android 15",by:"@gsi_team",size:"980 MB",date:"2026-09-28",
banner:"",shots:[],direct:"https://example.com/gsi",mirror:"https://example.com/gsi2",
info:"",changelog:["Security patch update"],about:"Near-stock GSI for Treble devices.",bugs:[],guide:["Flash with fastboot","Wipe data"],credits:["@gsi_team"],votes:210,dl:12800},
{id:4,title:"Ember Kernel r14",type:"Custom Kernel",stable:true,device:"Galaxy A52",codename:"a52q",android:"Android 13",by:"@kernel_dev",size:"24 MB",date:"2026-10-05",
banner:"",shots:[],direct:"https://example.com/kernel",mirror:"",
info:"",changelog:["Better battery life"],about:"Tuned for smooth scrolling.",bugs:[],guide:["Flash zip in recovery"],credits:["@kernel_dev"],votes:64,dl:2100}
];
/* ===== END DATA ===== */
const TYPES=["All types","Port","Custom ROM","GSI","Custom Kernel","Custom Recovery"];
let sort="new",type="All types",query="",cur=null,dtab="Info";
let voted=new Set();try{voted=new Set(JSON.parse(localStorage.getItem("votes")||"[]"))}catch(e){}
const dis=new Set(),FB={};
const $=id=>document.getElementById(id),byId=i=>POSTS.find(p=>p.id==i);
const fmt=n=>n>=1000?(n/1000).toFixed(1).replace(".0","")+"k":n;
const ul=(a,t)=>a&&a.length?`<${t||"ul"}>${a.map(i=>`<li>${i}</li>`).join("")}</${t||"ul"}>`:'<p class="m">–</p>';
const bn=(p,c)=>`<div class="bn ${c||""}" style="--h:${p.id*53%360}">${p.banner?`<img src="${p.banner}" alt="" loading="lazy" onerror="this.remove()">`:""}</div>`;
const badge=p=>`<span class="tag ${p.stable?"stable":"pre"}">${p.stable?"STABLE":"PRE-RELEASE"}</span>`;
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),1800)}
function renderList(){
$("chips").innerHTML=TYPES.map(x=>`<button class="chip" data-t="${x}" aria-pressed="${x===type}">${x}</button>`).join("");
const l=POSTS.filter(p=>(type==="All types"||p.type===type)&&[p.title,p.device,p.codename].join(" ").toLowerCase().includes(query.toLowerCase()));
l.sort((a,b)=>sort==="pop"?b.votes-a.votes:sort==="dl"?b.dl-a.dl:b.date.localeCompare(a.date));
$("count").textContent=l.length+(l.length===1?" post":" posts")+" available";
$("grid").innerHTML=l.length?l.map(p=>{const on=voted.has(p.id);return `<article class="card cut">${bn(p)}<div class="bd">
<div class="badges"><span class="tag">${p.type}</span>${badge(p)}</div>
<h3><a href="#/post/${p.id}">${p.title}</a></h3>
<p class="m">${p.device} · ${p.android} · ${p.size||""}</p><p class="m">${fmt(p.dl)} downloads</p>
<div class="row"><button class="vote" data-v="${p.id}" aria-pressed="${on}">▲ ${p.votes+(on?1:0)}</button><a class="go" href="#/post/${p.id}">View</a></div></div></article>`}).join(""):'<p class="empty">No posts match. Try another type or clear the search.</p>'}
function dlBtn(p,u,label,c){return u?`<a class="dl ${c||""}" data-d="${p.id}" href="${u}" target="_blank" rel="noopener">${label}</a>`:`<span class="dl off">${label} (not available)</span>`}
function showDetail(p){cur=p;const on=voted.has(p.id),x=dis.has(p.id),T=["Info","Changelog","Screenshots","Feedback","Disclaimer"];let b="";
if(dtab==="Info")b=`${p.info?`<p class="m">${p.info}</p>`:""}<h4>PORT INFO</h4><dl class="kv"><b>Device</b><span>${p.device}</span><b>Codename</b><span>${p.codename||"–"}</span><b>Android</b><span>${p.android}</span><b>Ported by</b><span>${p.by||"–"}</span><b>Size</b><span>${p.size||"–"}</span></dl>
<h4>ABOUT</h4><p class="m">${p.about||"–"}</p><h4>KNOWN BUGS</h4>${ul(p.bugs)}<h4>INSTALL GUIDE</h4>${ul(p.guide,"ol")}<h4>CREDITS</h4>${ul(p.credits)}
<h4>DOWNLOAD</h4><div class="acts">${dlBtn(p,p.direct,"Direct download")}${dlBtn(p,p.mirror,"Mirror","alt")}</div>`;
else if(dtab==="Changelog")b=`<h4>CHANGELOG</h4>${ul(p.changelog)}`;
else if(dtab==="Screenshots")b=`<h4>SCREENSHOTS</h4>${p.shots&&p.shots.length?`<div class="shots">${p.shots.map(s=>`<a href="${s}" target="_blank" rel="noopener"><img src="${s}" alt="Screenshot" loading="lazy"></a>`).join("")}</div>`:'<p class="m">No screenshots yet.</p>'}`;
else if(dtab==="Feedback"){const c=FB[p.id]||[];b=`<h4>FEEDBACK</h4>${c.map(()=>'<div class="cm"></div>').join("")||'<p class="m">No feedback yet. Share how this build works on your device.</p>'}<textarea class="in" id="fb" placeholder="Write your feedback" aria-label="Feedback"></textarea><button class="go" data-fb>Send feedback</button>`}
else b='<h4>DISCLAIMER</h4><p class="m">Flash at your own risk. Back up your data first. The maintainers are not responsible for bricked devices or lost data.</p>';
$("detail").innerHTML=`<a class="back" href="#/">← Back to all posts</a>${bn(p,"big cut")}<div class="badges"><span class="tag">${p.type}</span>${badge(p)}</div>
<h1 class="dt">${p.title}</h1><p class="m">${p.device} · ${p.codename||""} · ${p.android}</p><p class="m">Ported by ${p.by||"–"}</p>
<div class="acts"><button class="ghost" data-copy>Copy link</button><button class="vote" data-v="${p.id}" aria-pressed="${on}">▲ ${p.votes+(on?1:0)}</button><button class="vote" data-x="${p.id}" aria-pressed="${x}">▼ ${x?"Disliked":"Dislike"}</button></div>
<div class="tabs" role="tablist">${T.map(t=>`<button class="tab" role="tab" data-dt="${t}" aria-selected="${t===dtab}">${t}</button>`).join("")}</div><div class="pane">${b}</div>`;
(FB[p.id]||[]).forEach((t,i)=>{$("detail").querySelectorAll(".cm")[i].textContent=t})}
function route(){const m=location.hash.match(/^#\/post\/(\d+)/),p=m&&byId(m[1]);
$("list").hidden=!!p;$("detail").hidden=!p;
if(p){dtab="Info";showDetail(p)}else{cur=null;renderList()}scrollTo(0,0)}
document.addEventListener("click",e=>{
const a=e.target.closest("a[data-d]");if(a){byId(a.dataset.d).dl++;return}
const c=e.target.closest("button");if(!c)return;const d=c.dataset;
if(d.s){sort=d.s;document.querySelectorAll("#list .tab").forEach(x=>x.setAttribute("aria-selected",x===c));renderList()}
else if(d.t){type=d.t;renderList()}
else if(d.v){const i=+d.v;voted.has(i)?voted.delete(i):voted.add(i);try{localStorage.setItem("votes",JSON.stringify([...voted]))}catch(_){}cur?showDetail(cur):renderList()}
else if(d.x){const i=+d.x;dis.has(i)?dis.delete(i):dis.add(i);showDetail(cur)}
else if(d.dt){dtab=d.dt;showDetail(cur)}
else if(d.fb){const t=$("fb").value.trim();if(t){(FB[cur.id]=FB[cur.id]||[]).push(t);showDetail(cur)}}
else if(d.copy){try{navigator.clipboard.writeText(location.href).then(()=>toast("Link copied"),()=>toast("Copy the link from the address bar"))}catch(_){toast("Copy the link from the address bar")}}});
$("q").addEventListener("input",e=>{query=e.target.value;renderList()});
addEventListener("hashchange",route);
route();
</script>
</body>
</html>
